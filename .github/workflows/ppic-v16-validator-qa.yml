name: BAL PPIC V1.6 Manifest Validator QA
on:
  push:
    branches: [feat/ppic-manifest-validator-v16]
    paths: ['lib/**','tests/ppic-manifest-validator-v16.test.cjs','.github/workflows/ppic-v16-validator-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ppic-manifest-validator-v16.test.cjs
      - run: node tests/ppic-private-contract-v15.cjs
