name: BAL PPIC V3.5 Barang Jadi QA
on:
  push:
    branches: [feat/ppic-finished-goods-daily-v35]
    paths: ['index.html','auth.js','tests/ppic-v35-finished.spec.cjs','.github/workflows/ppic-v35-finished-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: JS syntax and privacy
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const html=fs.readFileSync('index.html','utf8'),auth=fs.readFileSync('auth.js','utf8');
          [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].forEach(x=>new vm.Script(x[1]));new vm.Script(auth);
          assert.ok(html.includes('data-view="finished"'));assert.ok(auth.includes('ppic_finished_goods_owner_view'));
          assert.ok(!html.includes('NEW GCC 99 12'));console.log('PASS private finished goods not in public HTML');
          JS
      - run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v35.log 2>&1 &
      - run: npx playwright test tests/ppic-v35-finished.spec.cjs tests/ppic-v33-material.spec.cjs --browser=chromium --workers=1 --reporter=list
