name: BAL PPIC V5.2 Payroll QA
on:
  push:
    branches: [main, feat/ppic-payroll-v52]
    paths: ['index.html','auth.js','sw.js','payroll*','tests/ppic-v52-*','tests/ppic-v46-sdm-three-reports.spec.cjs','.github/workflows/ppic-v52-payroll-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check payroll calculations and JavaScript
        run: |
          node --test tests/ppic-v52-payroll.test.cjs
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g))if(!/\bsrc=/.test(m[1]))new vm.Script(m[2]);
          for(const file of ['auth.js','sw.js','payroll.js','payroll-ui.js'])new vm.Script(fs.readFileSync(file,'utf8'),{filename:file});
          JS
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Start synthetic test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-payroll-qa.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test payroll previews, privacy, mobile layout, and existing SDM reports
        run: npx playwright test tests/ppic-v52-payroll.spec.cjs tests/ppic-v52-source-context.spec.cjs tests/ppic-v46-sdm-three-reports.spec.cjs --browser=chromium --workers=1 --reporter=list
      - name: Keep synthetic print review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payroll-v52-synthetic-print-review
          path: test-results/
          retention-days: 3
