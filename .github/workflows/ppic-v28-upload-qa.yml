name: BAL PPIC V2.8 Owner Upload QA
on:
  push:
    branches: [feat/ppic-owner-upload-v28]
    paths: ['index.html','auth.js','tests/ppic-v28-upload.spec.cjs','.github/workflows/ppic-v28-upload-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate JavaScript
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const h=fs.readFileSync('index.html','utf8'),a=fs.readFileSync('auth.js','utf8');
          [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].forEach(x=>new vm.Script(x[1]));
          new vm.Script(a);
          assert.ok(h.includes('data-view="upload"'));
          assert.ok(a.includes('/functions/v1/ppic-owner-upload'));
          assert.ok(!h.includes('sb_secret_'));
          console.log('PASS: owner upload UI and auth integration');
          JS
      - run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v28.log 2>&1 &
      - run: npx playwright test tests/ppic-v28-upload.spec.cjs tests/ppic-v26-all-reports.spec.cjs --browser=chromium --workers=1 --reporter=list
