name: BAL PPIC V1.4 PDF Share QA
on:
  push:
    branches: [feat/ppic-pdf-share-v14]
    paths: ['index.html','.github/workflows/ppic-v14-share-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          for(const token of ['id="sharePdf"','id="pdfFile"','application/pdf','navigator.canShare','navigator.share','id="previewModal"','https://wa.me/?text=','Periksa WhatsApp untuk memastikan file terkirim'])assert.ok(html.includes(token),token);
          assert.ok(!html.includes('fetch('));
          assert.ok(!html.includes('INTERACTIVE DEMO'));
          const js=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          assert.equal(js.length,1);
          new vm.Script(js[0][1]);
          console.log('PASS: V1.4 PDF file share path, fallback, JS syntax');
          JS
