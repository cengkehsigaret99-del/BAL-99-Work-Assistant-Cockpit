name: BAL PPIC V4.7 Guided Navigation QA
on:
  push:
    branches: [feat/ppic-guided-navigation-v47, main]
    paths: ['index.html','auth.js','tests/ppic-v47-navigation.spec.cjs','tests/ppic-v46-sdm-three-reports.spec.cjs','tests/ppic-v47-ux.spec.cjs','.github/workflows/ppic-v47-navigation-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate JavaScript
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g))if(!/\bsrc=/.test(m[1]))new vm.Script(m[2]);
          new vm.Script(fs.readFileSync('auth.js','utf8'));
          new vm.Script(fs.readFileSync('tests/ppic-v47-navigation.spec.cjs','utf8'));
          JS
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Start local web
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v47.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test guided navigation, SDM and print regression
        run: npx playwright test tests/ppic-v47-navigation.spec.cjs tests/ppic-v47-ux.spec.cjs tests/ppic-v46-sdm-three-reports.spec.cjs --browser=chromium --workers=1 --reporter=list
