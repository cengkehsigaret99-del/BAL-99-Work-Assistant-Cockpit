name: BAL PPIC V2.5 Sourced PDF QA
on:
  push:
    branches: [feat/ppic-report-data-pdf-v25]
    paths:
      - 'index.html'
      - 'auth.js'
      - 'tests/ppic-v25-report-pdf.spec.cjs'
      - '.github/workflows/ppic-v25-report-pdf-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('index.html','utf8'),a=fs.readFileSync('auth.js','utf8');
          const scripts=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];assert.equal(scripts.length,1);
          new vm.Script(scripts[0][1]);new vm.Script(a);
          assert.ok(!h.includes('5.216,05'));assert.ok(!a.includes('5.216,05'));
          assert.ok(a.includes('/rest/v1/ppic_reports_owner_view'));
          assert.ok(h.includes('if(!selectedSnapshot()||previewModal.hidden)return'));
          console.log('PASS: syntax and public/private boundary');
          JS
      - name: Browser tooling
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-report-qa.log 2>&1 &
      - run: npx playwright test tests/ppic-v25-report-pdf.spec.cjs --browser=chromium --workers=1 --reporter=list
