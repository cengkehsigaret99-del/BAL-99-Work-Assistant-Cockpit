name: BAL PPIC Premium Print V1.3 QA
on:
  push:
    branches: [feat/ppic-premium-print-v13]
    paths: ['index.html','.github/workflows/deploy-pages.yml','.github/workflows/ppic-v13-print-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  print-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate premium print and privacy
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const deploy=fs.readFileSync('.github/workflows/deploy-pages.yml','utf8');
          assert.ok(fs.existsSync('logo.png'));
          for(const s of ['logo.png','@page{size:A4 portrait','PERIODE DIPILIH','CUT-OFF SUMBER','BELUM ADA DATA AKTUAL TERVERIFIKASI','id="previewModal"','https://wa.me/?text='])assert.ok(html.includes(s),s);
          assert.ok(deploy.includes('cp logo.png dist/logo.png'));
          assert.ok(deploy.includes('path: \'dist\''));
          assert.ok(!html.includes('307.775'));
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          assert.equal(scripts.length,1);
          new vm.Script(scripts[0][1]);
          console.log('PASS: print preview, logo allowlist, JS syntax and no demo figures');
          JS
