name: PPIC canonical Cukai source QA
on:
  push:
    branches: [main, 'fix/cukai-*', 'feat/cukai-*']
    paths: ['cukai-sync.js','auth.js','daily-info-data.js','index.html','sw.js','supabase/migrations/*_ppic_cukai_canonical_source.sql','tests/ppic-cukai-*','tests/fixtures/cukai-synthetic.cjs','.github/workflows/ppic-cukai-source-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-contract-and-private-session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated DOM test dependency
        run: npm install --prefix /tmp/ppic-cukai-qa --no-save jsdom@26.1.0
      - name: Validate source identity, nulls, ordering, PDF and session races
        run: |
          node --check cukai-sync.js
          node --check auth.js
          node --test tests/ppic-cukai-source.test.cjs tests/ppic-cukai-auth.test.cjs tests/ppic-cukai-period-total.test.cjs tests/ppic-v60-robot-auth.test.cjs tests/ppic-v53-sync-auth.test.cjs tests/ppic-v50-daily-data.test.cjs tests/ppic-working-ledger25.test.mjs
          NODE_PATH=/tmp/ppic-cukai-qa/node_modules node --test tests/ppic-cukai-dom.test.cjs
