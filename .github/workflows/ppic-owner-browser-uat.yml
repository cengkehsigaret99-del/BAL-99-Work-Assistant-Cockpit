name: BAL PPIC V2.0 Owner Browser UAT
on:
  push:
    branches: [test/ppic-owner-login-browser-uat-v20]
    paths: ['tests/ppic-owner-login-browser.spec.cjs','.github/workflows/ppic-owner-browser-uat.yml','index.html','auth.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-browser.log 2>&1 &
      - run: npx playwright test tests/ppic-owner-login-browser.spec.cjs --browser=chromium --workers=1 --reporter=list
