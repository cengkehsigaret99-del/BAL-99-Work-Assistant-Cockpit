name: BAL PPIC V4.9 Current Sources QA
on:
  push:
    branches: [main, feat/ppic-latest-sources-v49]
    paths: ['index.html','auth.js','sw.js','tests/ppic-v49-*.spec.cjs','.github/workflows/ppic-v49-current-sources-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate public JavaScript
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g))if(!/\bsrc=/.test(m[1]))new vm.Script(m[2]);
          for(const f of ['auth.js','sw.js',...fs.readdirSync('tests').filter(x=>x.startsWith('ppic-v49-')).map(x=>'tests/'+x)])new vm.Script(fs.readFileSync(f,'utf8'));
          JS
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Start synthetic test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v49.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test cutoffs, private refresh, PDF and existing modules
        run: npx playwright test tests/ppic-v49-current-sources.spec.cjs tests/ppic-v49-private-refresh.spec.cjs tests/ppic-v48-do-value-only.spec.cjs tests/ppic-v43-excise-cost.spec.cjs tests/ppic-v47-ux.spec.cjs tests/ppic-v46-sdm-three-reports.spec.cjs --browser=chromium --workers=1 --reporter=list
