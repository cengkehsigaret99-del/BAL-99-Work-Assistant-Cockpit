name: BAL PPIC V2.2 Private Catalog QA
on:
  push:
    branches: [feat/ppic-private-catalog-v22]
    paths: ['index.html','auth.js','.github/workflows/ppic-v22-catalog-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict');
          const h=fs.readFileSync('index.html','utf8'),a=fs.readFileSync('auth.js','utf8');
          const scripts=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];assert.equal(scripts.length,1);
          new vm.Script(scripts[0][1]);new vm.Script(a);
          for(const marker of ['ppic_source_catalog','Authorization','Bearer ','docsRequest.abort()','window.ppicSetDocs([])','current===attempt'])assert.ok(a.includes(marker),marker);
          assert.ok(h.includes('td.textContent=String(r[field]'));
          assert.ok(!a.includes('service_role'));
          assert.ok(!a.includes('private_locator'));
          console.log('PASS: private owner metadata catalog, safe rendering and session clearing');
          JS
