name: Deploy BAL PPIC read-only site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PPIC_PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build public allowlist only
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp auth.js dist/auth.js
          cp sync-ui.js sync.css robot-ui.js robot.css ppic-qa-ui.js ppic-qa.css ppic-stage2-ui.js ppic-stage2.css ppic-stage3-ui.js ppic-stage3.css ppic-plan-ui.js ppic-plan.css ppic-skt-watch-ui.js ppic-skt-watch.css ppic-do-auto-ui.js ppic-do-auto.css ppic-sj-recon-ui.js ppic-sj-recon.css ppic-daily-intel-ui.js ppic-daily-intel.css ppic-charcoal-theme.css dist/
          cp daily-info-data.js daily-info.js daily-info-ui.js dist/
          cp payroll.js payroll-ui.js payroll.css dist/
          cp logo.png dist/logo.png
          cp bal-logo-user.webp dist/bal-logo-user.webp
          cp manifest.webmanifest dist/manifest.webmanifest
          cp sw.js dist/sw.js
          cp icon.svg dist/icon.svg
          python3 -m pip install --quiet cairosvg
          python3 - <<'PYICONS'
          import cairosvg
          for size in (192,512):
              cairosvg.svg2png(url="icon.svg",write_to=f"dist/icon-{size}.png",output_width=size,output_height=size)
          PYICONS
          printf '%s\n' 'User-agent: *' 'Disallow: /' > dist/robots.txt
          touch dist/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          dist=Path("dist")
          allowed={"index.html","auth.js","sync-ui.js","sync.css","robot-ui.js","robot.css","ppic-qa-ui.js","ppic-qa.css","ppic-stage2-ui.js","ppic-stage2.css","ppic-stage3-ui.js","ppic-stage3.css","ppic-plan-ui.js","ppic-plan.css","ppic-skt-watch-ui.js","ppic-skt-watch.css","ppic-do-auto-ui.js","ppic-do-auto.css","ppic-sj-recon-ui.js","ppic-sj-recon.css","ppic-daily-intel-ui.js","ppic-daily-intel.css","ppic-charcoal-theme.css","daily-info-data.js","daily-info.js","daily-info-ui.js","payroll.js","payroll-ui.js","payroll.css","logo.png","bal-logo-user.webp","manifest.webmanifest","sw.js","icon.svg","icon-192.png","icon-512.png","robots.txt",".nojekyll"}
          actual={p.name for p in dist.iterdir()}
          assert actual==allowed,(actual,allowed)
          s=(dist/"index.html").read_text()
          for marker in ('BAL · PPIC Control Tower','data-view="dashboard"','data-view="data"','data-view="reports"','data-view="sources"','data-view="sdm"','data-view="info"','id="infoDownload"','id="sdmBuild"','SDM GILING','SDM VERPACK','Belum terhubung'):
              assert marker in s,marker
          assert 'ppic-charcoal-theme.css' in s
          assert '<meta name="theme-color" content="#151719">' in s
          assert 'fetch(' not in s
          import json
          manifest=json.loads((dist/'manifest.webmanifest').read_text())
          assert manifest['display']=='standalone'
          assert {x['sizes'] for x in manifest['icons']} >= {'192x192','512x512'}
          assert (dist/'icon-192.png').read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a')
          assert (dist/'icon-512.png').read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a')
          sw=(dist/'sw.js').read_text()
          assert 'supabase' not in sw.lower()
          assert 'cache.addAll(SHELL)' in sw
          print("Public allowlist verified; no operational CSV or internal documents included")
          PY
      - name: Validate JavaScript and SDM dashboard controls
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const inline=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g)]
            .filter(m=>!/\bsrc=/.test(m[1])).map(m=>m[2]);
          if(!inline.length)throw Error('No inline scripts to check');
          inline.forEach((content,i)=>new vm.Script(content,{filename:'index-inline-'+i+'.js'}));
          for(const file of ['auth.js','sync-ui.js','robot-ui.js','ppic-qa-ui.js','ppic-stage2-ui.js','ppic-stage3-ui.js','ppic-plan-ui.js','ppic-skt-watch-ui.js','ppic-do-auto-ui.js','ppic-sj-recon-ui.js','ppic-daily-intel-ui.js','daily-info-data.js','daily-info.js','daily-info-ui.js','payroll.js','payroll-ui.js'])new vm.Script(fs.readFileSync(file,'utf8'),{filename:file});
          for(const key of ['id="sdmBuild"','id="sdmDiv"','id="sdmStart"','id="sdmEnd"','id="sdmRows"','id="sdmPeople"','SDM GILING','SDM VERPACK']){
            if(!html.includes(key))throw Error('SDM control missing: '+key);
          }
          if(!fs.readFileSync('auth.js','utf8').includes('ppic-sdm-rebuild'))throw Error('Private SDM processor client missing');
          console.log('PASS: all PPIC JS syntax and SDM controls');
          JS
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only sanitized public dist
        id: upload_public
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PPIC_PAGES_ARTIFACT }}
          path: 'dist'
      - name: Confirm current public artifact is ready
        env:
          GH_TOKEN: ${{ github.token }}
          PPIC_PAGES_ARTIFACT_ID: ${{ steps.upload_public.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          artifact_name=os.environ['PPIC_PAGES_ARTIFACT']
          artifact_id=os.environ['PPIC_PAGES_ARTIFACT_ID']
          run_id=os.environ['GITHUB_RUN_ID']
          commit=os.environ['GITHUB_SHA']
          if not artifact_id.isdigit():
              raise SystemExit('The public artifact upload did not return a valid ID.')
          query=urllib.parse.urlencode({'name':artifact_name,'per_page':100})
          url=f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/artifacts?{query}"
          request=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'
          })
          deadline=time.monotonic()+45
          confirmed=0
          while time.monotonic()<deadline:
              try:
                  with urllib.request.urlopen(request,timeout=min(5,deadline-time.monotonic())) as response:
                      payload=json.load(response)
                  matches=[a for a in payload.get('artifacts',[]) if a.get('name')==artifact_name and not a.get('expired')]
                  if len(matches)>1:
                      raise SystemExit('Ambiguous public artifact; deployment stopped.')
                  ready=False
                  if len(matches)==1:
                      artifact=matches[0]
                      provenance=artifact.get('workflow_run') or {}
                      ready=(str(artifact.get('id'))==artifact_id
                          and str(provenance.get('id'))==run_id
                          and provenance.get('head_sha')==commit
                          and artifact.get('size_in_bytes',0)>0)
                  confirmed=confirmed+1 if ready else 0
                  if confirmed>=2:
                      print('Verified one public artifact for this run, attempt and commit.')
                      break
              except urllib.error.HTTPError as error:
                  if error.code in (401,403):
                      raise SystemExit('Artifact readiness check was not authorized.') from None
                  confirmed=0
              except (urllib.error.URLError,TimeoutError,json.JSONDecodeError):
                  confirmed=0
              remaining=deadline-time.monotonic()
              if remaining>0:
                  time.sleep(min(2,remaining))
          else:
              raise SystemExit('Public artifact was not ready within 45 seconds; deployment stopped.')
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PPIC_PAGES_ARTIFACT }}

