name: Deploy BAL PPIC read-only site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build public allowlist only
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp auth.js dist/auth.js
          cp logo.png dist/logo.png
          printf '%s\n' 'User-agent: *' 'Disallow: /' > dist/robots.txt
          touch dist/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          dist=Path("dist")
          allowed={"index.html","auth.js","logo.png","robots.txt",".nojekyll"}
          actual={p.name for p in dist.iterdir()}
          assert actual==allowed,(actual,allowed)
          s=(dist/"index.html").read_text()
          for marker in ('BAL / PPIC Control Tower','data-view="dashboard"','data-view="data"','data-view="reports"','data-view="sources"','Belum terhubung'):
              assert marker in s,marker
          assert 'fetch(' not in s
          print("Public allowlist verified; no operational CSV or internal documents included")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only sanitized public dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
