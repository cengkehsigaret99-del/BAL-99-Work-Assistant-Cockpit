name: BAL PPIC V3.3 Material PDF QA
on:
  push:
    branches: [feat/ppic-material-pdf-template-v33]
    paths: ['index.html','auth.js','tests/ppic-v33-material.spec.cjs','.github/workflows/ppic-v33-material-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: JS syntax
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const html=fs.readFileSync('index.html','utf8'),auth=fs.readFileSync('auth.js','utf8');
          [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].forEach(x=>new vm.Script(x[1]));new vm.Script(auth);
          assert.ok(html.includes('data-view="materials"'));assert.ok(auth.includes('ppic_material_daily_owner_view'));
          assert.ok(!html.includes('AMBREE GCC 99'));console.log('PASS private materials not in public HTML');
          JS
      - run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v33.log 2>&1 &
      - run: npx playwright test tests/ppic-v33-material.spec.cjs tests/ppic-v31-customer.spec.cjs --browser=chromium --workers=1 --reporter=list
