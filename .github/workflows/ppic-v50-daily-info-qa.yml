name: BAL PPIC V5.0 Daily Info QA
on:
  push:
    branches: [main, feat/ppic-daily-info-v50]
    paths: ['index.html','auth.js','sw.js','daily-info*.js','tests/ppic-v50-*','tests/ppic-v47-ux.spec.cjs','.github/workflows/ppic-v50-daily-info-qa.yml','.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate JavaScript and daily calculation rules
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g))if(!/\bsrc=/.test(m[1]))new vm.Script(m[2]);
          for(const file of ['auth.js','sw.js','daily-info-data.js','daily-info.js','daily-info-ui.js'])new vm.Script(fs.readFileSync(file,'utf8'),{filename:file});
          JS
          node --test tests/ppic-v50-daily-data.test.cjs
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Start synthetic test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v50.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test daily JPEG, owner access and existing reports
        run: npx playwright test tests/ppic-v50-daily-info.spec.cjs tests/ppic-v50-daily-renderer.spec.cjs tests/ppic-v49-current-sources.spec.cjs tests/ppic-v49-private-refresh.spec.cjs tests/ppic-v48-do-value-only.spec.cjs tests/ppic-v43-excise-cost.spec.cjs tests/ppic-v47-ux.spec.cjs tests/ppic-v46-sdm-three-reports.spec.cjs --browser=chromium --workers=1 --reporter=list
