name: BAL PPIC V1.1 Visual Browser QA
on:
  push:
    branches: [feat/ppic-production-readonly-2026-11]
    paths:
      - 'index.html'
      - 'prototype/ppic-v11-visual.spec.cjs'
      - '.github/workflows/ppic-v11-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - run: |
          mkdir -p artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bal-ppic.log 2>&1 &
      - run: npx playwright test prototype/ppic-v11-visual.spec.cjs --browser=chromium --workers=1 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bal-ppic-v11-visual
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
