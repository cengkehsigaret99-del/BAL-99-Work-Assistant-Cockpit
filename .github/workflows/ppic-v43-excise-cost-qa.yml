name: BAL PPIC V4.3 Pita Cost QA
on:
  push:
    branches: [feat/ppic-pita-cost-v43, main]
    paths: ['index.html', 'auth.js', 'tests/ppic-v43-excise-cost.spec.cjs', '.github/workflows/ppic-v43-excise-cost-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          for(const match of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g)){
            if(!/\bsrc=/.test(match[1]))new vm.Script(match[2]);
          }
          new vm.Script(fs.readFileSync('auth.js','utf8'));
          new vm.Script(fs.readFileSync('tests/ppic-v43-excise-cost.spec.cjs','utf8'));
          JS
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Serve the public shell locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v43-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify costing, source status, stock dates, PDF and private cleanup
        run: npx playwright test tests/ppic-v43-excise-cost.spec.cjs tests/ppic-v37-excise.spec.cjs --browser=chromium --workers=1 --reporter=list
      - name: Retain synthetic visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppic-v43-synthetic-browser-qa
          path: test-results/
          retention-days: 7
