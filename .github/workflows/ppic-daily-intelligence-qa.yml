name: BAL PPIC Daily Intelligence QA
on:
  push:
    branches: [main, feat/ppic-daily-23nov, feat/ppic-daily-24nov-snapshot]
    paths:
      - index.html
      - auth.js
      - ppic-daily-intel-ui.js
      - ppic-daily-intel.css
      - sw.js
      - tools/ppic_health_check.py
      - .github/workflows/deploy-pages.yml
      - supabase/functions/ppic-daily-intelligence/**
      - supabase/migrations/*_ppic_daily_intelligence.sql
      - tests/ppic-daily-intelligence.test.mjs
      - tests/ppic-daily-intelligence.spec.cjs
      - .github/workflows/ppic-daily-intelligence-qa.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  daily-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test Owner access, output filtering, and previous stages
        run: |
          node --test tests/ppic-daily-intelligence.test.mjs tests/ppic-sj-crossbook-status.test.mjs tests/ppic-do-sync-health.test.mjs tests/ppic-stage3-status.test.mjs
          node --check auth.js
          node --check ppic-daily-intel-ui.js
          node --check supabase/functions/ppic-daily-intelligence/validation.mjs
          python3 -m unittest discover -s tests -p ppic_health_check_test.py
      - name: Sanitize published JS and verify bundle allowlist
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8'),auth=fs.readFileSync('auth.js','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g))if(!/\bsrc=/.test(m[1]))new vm.Script(m[2]);
          for(const id of ['ppicDailyIntelPanel','ppicDailyIntelKpis','ppicDailyIntelBadge','ppicDailyIntelTime','ppicDailyIntelNotice','ppicDailyIntelRefresh','ppicDailyIntelSources','ppicDailyIntelRisks','ppicDailyIntelActions','ppicDailyIntelAsk'])
            if(!html.includes('id="'+id+'"'))throw Error('Missing daily intelligence UI '+id);
          for(const hook of ['ppicLoadDailyIntel','ppicDailyIntelSessionReady','ppicDailyIntelClear'])
            if(!auth.includes(hook))throw Error('Owner session hook missing '+hook);
          const js=fs.readFileSync('ppic-daily-intel-ui.js','utf8');
          if(/innerHTML|insertAdjacentHTML|eval\(/.test(js))throw Error('Unsafe dynamic daily rendering');
          if(/sk-proj-|sk-[A-Za-z0-9]{25,}/.test(JSON.stringify([html,auth,js])))throw Error('Possible secret in browser');
          const deploy=fs.readFileSync('.github/workflows/deploy-pages.yml','utf8'),sw=fs.readFileSync('sw.js','utf8'),
            health=fs.readFileSync('tools/ppic_health_check.py','utf8');
          for(const asset of ['ppic-daily-intel-ui.js','ppic-daily-intel.css'])
            if(!deploy.includes(asset)||!sw.includes(asset)||!health.includes(asset))throw Error('Missing shell asset '+asset);
          JS
      - name: Install Chromium and browser test runner
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Start private Owner shell mock
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-daily-intel.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser UAT for Owner and narrow mobile viewport
        run: npx playwright test tests/ppic-daily-intelligence.spec.cjs --browser=chromium --workers=1 --reporter=list
