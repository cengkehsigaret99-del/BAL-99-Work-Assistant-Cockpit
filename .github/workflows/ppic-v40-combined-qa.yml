name: BAL PPIC V4.0 SDM Combined QA
on:
  push:
    branches: [feat/ppic-sdm-combined-v40]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-combined.log 2>&1 &
      - run: npx playwright test tests/ppic-v40-combined.spec.cjs tests/ppic-v38-sdm.spec.cjs --browser=chromium --workers=1 --reporter=list
