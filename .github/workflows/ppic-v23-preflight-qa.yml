name: BAL PPIC V2.3 Ingestion Preflight QA
on:
  push:
    branches: [feat/ppic-ingestion-preflight-v23]
    paths: ['tools/ppic-preflight.cjs','tests/ppic-preflight-v23.test.cjs','.github/workflows/ppic-v23-preflight-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ppic-preflight-v23.test.cjs
      - run: node --test tests/ppic-manifest-validator-v16.test.cjs
