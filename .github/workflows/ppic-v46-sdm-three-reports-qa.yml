name: BAL PPIC V4.6 SDM Three Reports QA
on:
  push:
    branches: [feat/ppic-sdm-three-reports-v46, main]
    paths: ['index.html','auth.js','tests/ppic-v46-sdm-three-reports.spec.cjs','.github/workflows/ppic-v46-sdm-three-reports-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate JS syntax and private data separation
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g))if(!/\bsrc=/.test(m[1]))new vm.Script(m[2]);
          new vm.Script(fs.readFileSync('auth.js','utf8'));
          for(const id of ['sdmPrintGiling','sdmPrintVerpack','sdmPrintCombined','sdmSourceAudit']){
            if(!html.includes('id="'+id+'"'))throw Error('SDM UI element missing '+id);
          }
          if(html.includes('MUDRIKAH')||html.includes('ISRIYAH'))throw Error('Private SDM worker data found in public shell');
          JS
      - name: Install browser QA
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ppic-v46.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Validate three SDM reports and regressions
        run: npx playwright test tests/ppic-v46-sdm-three-reports.spec.cjs tests/ppic-v40-combined.spec.cjs tests/ppic-v38-sdm.spec.cjs --browser=chromium --workers=1 --reporter=list
